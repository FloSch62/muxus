appId: io.github.flosch62.muxus
productName: Muxus
executableName: muxus
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: ../client/dist
    to: client
  - from: build/icons/256x256.png
    to: icon.png
icon: build/icon.png
artifactName: muxus-${version}-${os}-${arch}.${ext}
npmRebuild: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  identity: null
  notarize: false
  # Native modules ship both Darwin prebuilds in each architecture package,
  # and the keyring binding ships one single-arch package per CPU with both
  # bundled into each slice. All are already architecture-specific, so do not
  # lipo them again.
  x64ArchFiles: "{**/prebuilds/darwin*/**,**/node_modules/@napi-rs/keyring-darwin-*/**}"
  # The keyring binding uses separate package names for Darwin x64 and arm64.
  # Preserve both architecture-only package trees when merging their ASARs.
  singleArchFiles: "**/node_modules/@napi-rs/keyring-darwin-*{,/**}"
  target:
    - target: dmg
      arch: [universal]
dmg:
  sign: false
linux:
  category: Network
  synopsis: SSH, Telnet & serial client
  icon: build/icons
  desktop:
    entry:
      StartupWMClass: muxus
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
deb:
  afterInstall: linux/after-install.tpl
publish:
  provider: github
  owner: FloSch62
  repo: muxus
  releaseType: release
