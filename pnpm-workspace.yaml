packages:
  - shared
  - server
  - client
  - desktop
  - tests
# Keep local lockfile updates aligned with pnpm 11's CI supply-chain policy.
minimumReleaseAge: 1440
# Include native Node-API prebuilds for both desktop architectures.
supportedArchitectures:
  os: [current]
  cpu: [current, x64, arm64]
overrides:
  '@serialport/bindings-cpp': 13.0.1
  'brace-expansion@>=5.0.0 <5.0.8': 5.0.8
  'dompurify@>=3.4.0 <3.4.13': 3.4.13
allowBuilds:
  bun: true
  esbuild: true
  sharp: true
  ssh2: true
  core-js-pure: false
  cpu-features: false
  '@serialport/bindings-cpp': true
patchedDependencies:
  '@serialport/bindings-cpp@13.0.1': patches/@serialport__bindings-cpp@13.0.1.patch
