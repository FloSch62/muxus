packages:
  - shared
  - engine
  - server
  - client
  - electron
  - tests
# Keep local lockfile updates aligned with pnpm 11's CI supply-chain policy.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # First-party containerlab viewer, released together with Muxus changes.
  - '@containerlab/clab-viewer@0.2.0'
# Install per-arch native prebuilds (notably @napi-rs/keyring-darwin-*) for
# both desktop CPUs so the macOS universal build can bundle the x64 slice
# even though release runners are arm64.
supportedArchitectures:
  os: [current]
  cpu: [current, x64, arm64]
overrides:
  '@serialport/bindings-cpp': 13.0.1
  'brace-expansion@>=5.0.0 <5.0.8': 5.0.8
  'dompurify@<3.4.17': 3.4.17
  # kdbxweb (no release since 2021) still asks for the unpatched 0.7 line.
  'kdbxweb>@xmldom/xmldom': 0.8.15
allowBuilds:
  esbuild: true
  electron: true
  sharp: true
  node-pty: true
  # Only the tests use ssh2, as the server they connect to; its optional
  # native speed-ups are not worth a compiler there.
  ssh2: false
  core-js-pure: false
  electron-winstaller: false
  cpu-features: false
  '@serialport/bindings-cpp': true
patchedDependencies:
  '@novnc/novnc@1.7.0': patches/@novnc__novnc@1.7.0.patch
  '@serialport/bindings-cpp@13.0.1': patches/@serialport__bindings-cpp@13.0.1.patch
  '@xterm/addon-webgl@0.20.0-beta.331': patches/@xterm__addon-webgl@0.20.0-beta.331.patch
  '@xterm/xterm@6.1.0-beta.338': patches/@xterm__xterm@6.1.0-beta.338.patch
