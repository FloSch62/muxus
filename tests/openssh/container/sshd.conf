# Drop-ins are read first, and the first value of a keyword wins.
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
AllowTcpForwarding yes
AllowAgentForwarding yes
GatewayPorts clientspecified
X11Forwarding yes
PermitRootLogin no
LogLevel VERBOSE
Subsystem sftp internal-sftp
TrustedUserCAKeys /etc/ssh/muxus-ca.pub
AcceptEnv LANG LC_* MUXUS_TEST
# What old network gear speaks, so the legacy algorithms are tested against a real server.
Ciphers +aes256-cbc,3des-cbc
KexAlgorithms +diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
HostKeyAlgorithms +ssh-rsa
MACs +hmac-sha1

Match User kbd
    AuthenticationMethods keyboard-interactive
Match User twostep
    AuthenticationMethods publickey,password
Match User nofwd
    AllowTcpForwarding no
Match User twosessions
    MaxSessions 2
