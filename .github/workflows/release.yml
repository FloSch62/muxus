name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.20.0
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      store_eligible: ${{ steps.release.outputs.store_eligible }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify package versions match the tag
        run: >-
          node -e "const root = require('./package.json');
          const desktop = require('./electron/package.json');
          const expected = 'v' + root.version;
          if (desktop.version !== root.version)
          throw new Error('Root and Electron package versions do not match');
          if (process.env.RELEASE_TAG !== expected)
          throw new Error('Release tag ' + process.env.RELEASE_TAG + ' does not match package version ' + expected);
          console.log('Building Muxus ' + root.version);"

      - name: Verify GitHub release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_preview=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')
          if [ "$is_preview" = false ]; then
            echo "store_eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "store_eligible=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            build_args: --linux AppImage deb --x64
            artifact_name: linux-x64
            artifact_path: |
              electron/release/*.AppImage
              electron/release/*.deb
          - name: Windows x64
            os: windows-latest
            build_args: --win nsis --x64
            artifact_name: windows-x64
            artifact_path: electron/release/*.exe
          - name: Windows ARM64
            os: windows-11-arm
            build_args: --win nsis --arm64
            artifact_name: windows-arm64
            artifact_path: electron/release/*.exe
          - name: macOS universal
            os: macos-latest
            build_args: --mac dmg --universal
            artifact_name: macos-universal
            artifact_path: electron/release/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build installers
        run: pnpm --filter @muxus/electron dist ${{ matrix.build_args }}
        env:
          MUXUS_RELEASE: '1'
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: schwarz.flori.88@googlemail.com
          APPLE_TEAM_ID: DJY795VD98
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING || 'unsigned' }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_P12_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
          WINDOWS_SIGN_SCRIPT: ${{ vars.WINDOWS_SIGN_SCRIPT }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}

      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS'
        run: node hack/verify-macos-artifacts.mjs

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./hack/verify-windows-signatures.ps1
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING || 'unsigned' }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}

      - name: Build Microsoft Store submission
        if: matrix.artifact_name == 'windows-x64' && vars.MICROSOFT_STORE_IDENTITY_NAME != ''
        run: pnpm --filter @muxus/electron dist:store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
          MICROSOFT_STORE_IDENTITY_NAME: ${{ vars.MICROSOFT_STORE_IDENTITY_NAME }}
          MICROSOFT_STORE_PUBLISHER: ${{ vars.MICROSOFT_STORE_PUBLISHER }}
          MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}

      - name: Store Microsoft Store submission
        if: matrix.artifact_name == 'windows-x64' && vars.MICROSOFT_STORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: muxus-windows-store
          path: electron/release-store/*.appx
          if-no-files-found: error
          retention-days: 14

      - name: Verify universal keyring binaries
        if: runner.os == 'macOS'
        run: |
          app="electron/release/mac-universal/Muxus.app"
          if [ ! -d "$app" ]; then
            echo "Universal app bundle not found; release contents:" >&2
            ls electron/release >&2
            exit 1
          fi
          for arch in x64 arm64; do
            ls "$app/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs/keyring-darwin-$arch/"*.node
          done

      - name: Store installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1

  sign-linux:
    name: Sign Linux release assets
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: linux-release-signing
    permissions:
      contents: read
    steps:
      # Always use signing logic and the pinned public key from the protected
      # default branch, never executable code from the release tag.
      - name: Check out Linux signing policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/release-keys/linux-signing-key.asc
            hack/sign-linux-release.sh
          sparse-checkout-cone-mode: false
          path: signing-policy

      - name: Download Linux installers
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: linux-assets

      - name: Import restricted Linux signing subkey
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$LINUX_SIGNING_PRIVATE_KEY" ]; then
            echo "LINUX_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/muxus-linux-signing-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$LINUX_SIGNING_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Sign and verify Linux installers
        env:
          LINUX_SIGNING_KEY_PASSPHRASE: ${{ secrets.LINUX_SIGNING_KEY_PASSPHRASE }}
        run: >-
          signing-policy/hack/sign-linux-release.sh
          linux-assets
          linux-signatures
          signing-policy/.github/release-keys/linux-signing-key.asc

      - name: Store Linux signatures
        uses: actions/upload-artifact@v7
        with:
          name: linux-signatures
          path: linux-signatures/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Upload release assets
    needs:
      - verify
      - build
      - sign-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          # Exclude the unsigned muxus-windows-store submission artifact.
          pattern: '{linux-*,windows-*,macos-*}'
          merge-multiple: true

      - name: Check out the VcXsrv pin
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
          sparse-checkout: electron/scripts/vcxsrv.mjs
          sparse-checkout-cone-mode: false
          path: release-source

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Windows installers ship VcXsrv (GPLv3); its corresponding source
      # travels with every release, as the bundled NOTICE.txt promises.
      - name: Attach VcXsrv source
        run: node release-source/electron/scripts/vcxsrv.mjs --source release-assets

      - name: Upload installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      # The docs deploy writes site/latest.json from the latest GitHub release,
      # which powers the in-app update check for all installed versions.
      - name: Refresh Pages update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"

  publish-store:
    name: Submit Microsoft Store update
    needs: [verify, publish]
    if: >-
      github.repository == 'FloSch62/muxus' &&
      vars.MICROSOFT_STORE_PUBLISH == 'true' &&
      vars.MICROSOFT_STORE_IDENTITY_NAME != '' &&
      needs.verify.outputs.store_eligible == 'true' &&
      !contains(github.event.release.tag_name || inputs.tag, '-')
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: microsoft-store-muxus
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: muxus-windows-store
          path: store-package
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        with:
          version: v0.4.2
      - name: Configure Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          foreach ($name in @('AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET', 'SELLER_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions secret: $name"
            }
          }
          msstore reconfigure --tenantId "$env:AZURE_AD_TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store authentication configuration failed.' }
      - name: Submit Store update for certification
        run: node hack/publish-microsoft-store.mjs store-package
        env:
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
          MICROSOFT_STORE_IDENTITY_NAME: ${{ vars.MICROSOFT_STORE_IDENTITY_NAME }}
