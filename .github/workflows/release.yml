name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.20.0
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify package versions match the tag
        run: >-
          node -e "const root = require('./package.json');
          const desktop = require('./desktop/package.json');
          const expected = 'v' + root.version;
          if (desktop.version !== root.version)
          throw new Error('Root and desktop package versions do not match');
          if (process.env.RELEASE_TAG !== expected)
          throw new Error('Release tag ' + process.env.RELEASE_TAG + ' does not match package version ' + expected);
          console.log('Building Muxus ' + root.version);"

      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact_name: linux-x64
          - name: Windows x64
            os: windows-latest
            artifact_name: windows-x64
          - name: Windows ARM64
            os: windows-11-arm
            artifact_name: windows-arm64
          - name: macOS Apple Silicon
            os: macos-15
            artifact_name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build native installers
        run: pnpm --filter @muxus/desktop dist

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: pnpm --filter @muxus/desktop deb

      - name: Verify release payload
        run: node hack/verify-desktop-artifacts.mjs

      - name: Store installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 1

  sign-linux:
    name: Sign Linux release assets
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: linux-release-signing
    permissions:
      contents: read
    steps:
      # Always use signing logic and the pinned public key from the protected
      # default branch, never executable code from the release tag.
      - name: Check out Linux signing policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/release-keys/linux-signing-key.asc
            hack/sign-linux-release.sh
          sparse-checkout-cone-mode: false
          path: signing-policy

      - name: Download Linux installers
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: linux-assets

      - name: Import restricted Linux signing subkey
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$LINUX_SIGNING_PRIVATE_KEY" ]; then
            echo "LINUX_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/muxus-linux-signing-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$LINUX_SIGNING_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Sign and verify Linux installers
        env:
          LINUX_SIGNING_KEY_PASSPHRASE: ${{ secrets.LINUX_SIGNING_KEY_PASSPHRASE }}
        run: >-
          signing-policy/hack/sign-linux-release.sh
          linux-assets
          linux-signatures
          signing-policy/.github/release-keys/linux-signing-key.asc

      - name: Store Linux signatures
        uses: actions/upload-artifact@v7
        with:
          name: linux-signatures
          path: linux-signatures/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Upload release assets
    needs:
      - verify
      - build
      - sign-linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      # The docs deploy writes site/latest.json from the latest GitHub release,
      # which powers the in-app update check for all installed versions.
      - name: Refresh Pages update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"
