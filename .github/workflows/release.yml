name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify package versions match the tag
        run: >-
          node -e "const root = require('./package.json');
          const desktop = require('./electron/package.json');
          const expected = 'v' + root.version;
          if (desktop.version !== root.version)
          throw new Error('Root and Electron package versions do not match');
          if (process.env.RELEASE_TAG !== expected)
          throw new Error('Release tag ' + process.env.RELEASE_TAG + ' does not match package version ' + expected);
          console.log('Building Muxus ' + root.version);"

      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            build_args: --linux AppImage deb --x64
            artifact_name: linux-x64
            artifact_path: |
              electron/release/*.AppImage
              electron/release/*.deb
          - name: Windows x64
            os: windows-latest
            build_args: --win nsis --x64
            artifact_name: windows-x64
            artifact_path: electron/release/*.exe
          - name: macOS universal
            os: macos-latest
            # The override also backfills tags created before x64ArchFiles was added
            # to electron-builder.yml, including v0.1.0.
            build_args: --mac dmg --universal -c.mac.x64ArchFiles="**/prebuilds/darwin*/**"
            artifact_name: macos-universal
            artifact_path: electron/release/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build installers
        run: pnpm --filter @muxus/electron exec electron-builder ${{ matrix.build_args }} --publish never

      - name: Store installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Upload release assets
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload installers to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
