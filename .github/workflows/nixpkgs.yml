name: nixpkgs

# After a release: bump version and hashes in nix/nixpkgs, check the package
# builds, and open a PR so `nix flake update muxus` picks up the release once
# merged. The hashes only exist once the tag does, so this cannot happen before
# it. Needs "Allow GitHub Actions to create and approve pull requests".
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.14.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: cachix/install-nix-action@v31

      - name: Bump and build
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          nix run nixpkgs#nix-update -- --flake --version "${TAG#v}" muxus
          nix build .#muxus --no-link

      - name: Open a PR with the bump
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git diff --quiet && exit 0
          branch="nix/bump-${TAG#v}"
          title="nix: bump muxus to ${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          # A re-run updates the branch above; its PR already exists.
          gh pr view "$branch" --json state --jq .state | grep -qx OPEN \
            || gh pr create --base main --head "$branch" --title "$title" --body "Automated bump after the $TAG release."
