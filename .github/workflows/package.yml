name: Package installers

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize the macOS package using the release credentials
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            build_args: --linux deb --x64
            artifact_name: linux-deb-x64
            artifact_path: electron/release/*.deb

          - name: Windows x64
            os: windows-latest
            build_args: --win nsis --x64
            artifact_name: windows-exe-x64
            artifact_path: electron/release/*.exe

          - name: Windows ARM64
            os: windows-11-arm
            build_args: --win nsis --arm64
            artifact_name: windows-exe-arm64
            artifact_path: electron/release/*.exe

          - name: macOS universal
            os: macos-latest
            build_args: --mac dmg --universal
            artifact_name: macos-dmg-universal
            artifact_path: electron/release/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build installer
        run: pnpm --filter @muxus/electron dist ${{ matrix.build_args }}
        env:
          MUXUS_RELEASE: ${{ inputs.sign_macos && '1' || '' }}
          CSC_LINK: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: schwarz.flori.88@googlemail.com
          APPLE_TEAM_ID: DJY795VD98
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.sign_macos && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}

      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS' && inputs.sign_macos
        run: node hack/verify-macos-artifacts.mjs

      - name: Verify universal keyring binaries
        if: runner.os == 'macOS'
        run: |
          app="electron/release/mac-universal/Muxus.app"
          if [ ! -d "$app" ]; then
            echo "Universal app bundle not found; release contents:" >&2
            ls electron/release >&2
            exit 1
          fi
          for arch in x64 arm64; do
            ls "$app/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs/keyring-darwin-$arch/"*.node
          done

      - name: Store installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
