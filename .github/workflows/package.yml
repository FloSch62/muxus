name: Package installers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact_name: linux-x64
          - name: Windows x64
            os: windows-latest
            artifact_name: windows-x64
          - name: Windows ARM64
            os: windows-11-arm
            artifact_name: windows-arm64
          - name: macOS Apple Silicon
            os: macos-15
            artifact_name: macos-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build native installers
        run: pnpm --filter @muxus/desktop dist

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: pnpm --filter @muxus/desktop deb

      - name: Verify release payload
        run: node hack/verify-desktop-artifacts.mjs

      - name: Store installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14
