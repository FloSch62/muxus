name: macOS SSH hotfix artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0

jobs:
  build:
    name: Build universal macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build universal DMG
        run: >-
          pnpm --filter @muxus/electron exec electron-builder
          --mac dmg --universal --publish never
          '-c.artifactName=muxus-0.3.0-ssh-hotfix-${os}-${arch}.${ext}'
          -c.mac.x64ArchFiles="{**/prebuilds/darwin*/**,**/node_modules/@napi-rs/keyring-darwin-*/**}"
          -c.mac.singleArchFiles="**/node_modules/@napi-rs/keyring-darwin-*{,/**}"

      - name: Verify universal app and fix payload
        run: |
          app="electron/release/mac-universal/Muxus.app"
          test -d "$app"
          file "$app/Contents/MacOS/muxus" | grep -q "universal binary"
          for arch in x64 arm64; do
            ls "$app/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs/keyring-darwin-$arch/"*.node
          done
          grep -a -q "SSH agent did not respond while" "$app/Contents/Resources/app.asar"
          ls electron/release/muxus-0.3.0-ssh-hotfix-mac-universal.dmg

      - name: Store DMG
        uses: actions/upload-artifact@v7
        with:
          name: muxus-macos-universal-ssh-hotfix
          path: electron/release/muxus-0.3.0-ssh-hotfix-mac-universal.dmg
          if-no-files-found: error
          retention-days: 1
