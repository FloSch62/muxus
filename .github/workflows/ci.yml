name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check bundle budgets
        run: pnpm check:bundle

  package-smoke:
    name: Package (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            pack_args: "--x64"
          - name: macOS universal
            os: macos-latest
            # Build universal like the release job so both per-arch
            # @napi-rs/keyring packages are exercised on every change.
            pack_args: "--universal"
          - name: Windows x64
            os: windows-latest
            pack_args: "--x64"
          - name: Windows ARM64
            os: windows-11-arm
            pack_args: "--arm64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runner login keychains are not reliably unlocked; give the keyring
      # roundtrip test a dedicated unlocked default keychain instead.
      - name: Prepare macOS CI keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p muxus-ci muxus-ci.keychain
          security list-keychains -d user -s muxus-ci.keychain
          security default-keychain -s muxus-ci.keychain
          security unlock-keychain -p muxus-ci muxus-ci.keychain
          security set-keychain-settings muxus-ci.keychain

      - name: Test OS credential-store roundtrip
        if: runner.os != 'Linux'
        env:
          MUXUS_OS_KEYRING_SMOKE: "1"
        run: pnpm --filter @muxus/tests exec vitest run unit/server/vault-key-store.os.test.ts

      - name: Build workspace
        run: pnpm build

      - name: Build unpacked desktop application
        run: pnpm --filter @muxus/electron pack:dir ${{ matrix.pack_args }}

      - name: Verify Windows ARM64 native binaries
        if: matrix.name == 'Windows ARM64'
        shell: pwsh
        run: |
          $app = "electron/release/win-arm64-unpacked/resources/app.asar.unpacked/node_modules"
          $binaries = @(
            "$app/node-pty/prebuilds/win32-arm64/pty.node"
            "$app/@serialport/bindings-cpp/prebuilds/win32-arm64/@serialport+bindings-cpp.armv8.node"
          )
          foreach ($binary in $binaries) {
            if (-not (Test-Path -LiteralPath $binary)) {
              throw "Windows ARM64 native binary not found: $binary"
            }
          }
          if (-not (Get-ChildItem -Path "$app/@napi-rs/keyring-win32-arm64-msvc/*.node")) {
            throw "Windows ARM64 keyring binary not found"
          }

      - name: Verify universal keyring binaries
        if: runner.os == 'macOS'
        run: |
          app="electron/release/mac-universal/Muxus.app"
          if [ ! -d "$app" ]; then
            echo "Universal app bundle not found; release contents:" >&2
            ls electron/release >&2
            exit 1
          fi
          for arch in x64 arm64; do
            ls "$app/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs/keyring-darwin-$arch/"*.node
          done
