name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test Linux release signing
        run: hack/test-linux-release-signing.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare desktop SDK
        run: pnpm --filter @muxus/desktop prepare:sdk

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check bundle budgets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm --filter @muxus/client build

          if [ -z "$BASE_SHA" ]; then
            node client/scripts/check-bundle-budget.mjs
            exit
          fi

          base_dir="$RUNNER_TEMP/muxus-base"
          base_report="$RUNNER_TEMP/base-bundle.json"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          pnpm --dir "$base_dir" install --frozen-lockfile
          pnpm --dir "$base_dir" --filter @muxus/shared build
          pnpm --dir "$base_dir" --filter @muxus/client build
          node client/scripts/check-bundle-budget.mjs \
            --dist "$base_dir/client/dist" \
            --write-report "$base_report" \
            --report-only
          node client/scripts/check-bundle-budget.mjs --baseline "$base_report"

  package-smoke:
    name: Package (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS Apple Silicon
            os: macos-15
          - name: Windows x64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runner login keychains are not reliably unlocked; give the keyring
      # roundtrip test a dedicated unlocked default keychain instead.
      - name: Prepare macOS CI keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p muxus-ci muxus-ci.keychain
          security list-keychains -d user -s muxus-ci.keychain
          security default-keychain -s muxus-ci.keychain
          security unlock-keychain -p muxus-ci muxus-ci.keychain
          security set-keychain-settings muxus-ci.keychain

      - name: Test OS credential-store roundtrip
        if: runner.os != 'Linux'
        env:
          MUXUS_OS_KEYRING_SMOKE: "1"
        run: pnpm --filter @muxus/tests test unit/server/vault-key-store.os.test.ts

      - name: Build workspace
        run: pnpm build

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libsecret-1-0 fontconfig webkit2gtk-driver

      - name: Build unpacked native desktop
        run: pnpm --filter @muxus/desktop run pack

      - name: Verify packaged Bun runtime
        run: pnpm smoke

      - name: Native WebKitGTK tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum sh -c 'openbox >/tmp/muxus-openbox.log 2>&1 & pnpm test:desktop'

      - name: Upload native diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-report-${{ runner.os }}-${{ runner.arch }}
          path: |
            tests/desktop/.results
            tests/desktop-report
