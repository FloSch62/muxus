name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test Linux release signing
        run: hack/test-linux-release-signing.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up the SSH engine toolchain
        uses: ./.github/actions/setup-ssh-engine

      - name: Lint SSH engine
        run: pnpm lint:engine

      - name: Test SSH engine
        run: pnpm test:engine

      # The tests load the engine, and its typings are checked in.
      - name: Build SSH engine
        run: |
          pnpm --filter @muxus/ssh-engine build
          git diff --exit-code engine/index.d.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The connection stack against a real sshd in a container.
      - name: Test against OpenSSH
        run: pnpm test:openssh

      - name: Test release submission safeguards
        run: pnpm test:release

  package-smoke:
    name: Package (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            pack_args: "--x64"
          - name: macOS universal
            os: macos-latest
            # Build universal like the release job so both per-arch
            # @napi-rs/keyring packages are exercised on every change.
            pack_args: "--universal"
          - name: Windows x64
            os: windows-latest
            pack_args: "--x64"
          - name: Windows ARM64
            os: windows-11-arm
            pack_args: "--arm64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runner login keychains are not reliably unlocked; give the keyring
      # roundtrip test a dedicated unlocked default keychain instead.
      - name: Prepare macOS CI keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p muxus-ci muxus-ci.keychain
          security list-keychains -d user -s muxus-ci.keychain
          security default-keychain -s muxus-ci.keychain
          security unlock-keychain -p muxus-ci muxus-ci.keychain
          security set-keychain-settings muxus-ci.keychain

      - name: Test OS credential-store roundtrip
        if: runner.os != 'Linux'
        env:
          MUXUS_OS_KEYRING_SMOKE: "1"
        run: pnpm --filter @muxus/tests exec vitest run unit/server/vault-key-store.os.test.ts

      - name: Set up the SSH engine toolchain
        uses: ./.github/actions/setup-ssh-engine

      - name: Build workspace
        run: pnpm build

      # dist does this itself; pack:dir needs the bundled X server prepared.
      - name: Prepare bundled X server
        if: runner.os == 'Windows'
        run: node electron/scripts/vcxsrv.mjs

      - name: Build unpacked desktop application
        run: pnpm --filter @muxus/electron pack:dir ${{ matrix.pack_args }}

      # The release job runs this too; running it here catches UI changes that
      # break it before a release is tagged. Nothing is published.
      - name: Test packaged updater against localhost
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @muxus/electron test:updater

      - name: Smoke-test bundled X server
        if: runner.os == 'Windows'
        run: node hack/smoke-x11-server.mjs

      # CI exercises AppX without credentials or a reserved product. These
      # placeholder packages are never uploaded or submitted to the Store.
      - name: Smoke-test Microsoft Store packaging
        if: matrix.name == 'Windows x64'
        run: pnpm --filter @muxus/electron dist:store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MICROSOFT_STORE_PRODUCT_ID: 9MUXUS000000
          MICROSOFT_STORE_IDENTITY_NAME: Muxus.CI
          MICROSOFT_STORE_PUBLISHER: CN=Muxus CI
          MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME: Muxus CI

      - name: Verify Windows ARM64 native binaries
        if: matrix.name == 'Windows ARM64'
        shell: pwsh
        run: |
          $app = "electron/release/win-arm64-unpacked/resources/app.asar.unpacked/node_modules"
          $binaries = @(
            "$app/node-pty/prebuilds/win32-arm64/pty.node"
            "$app/@serialport/bindings-cpp/build/Release/bindings.node"
          )
          foreach ($binary in $binaries) {
            if (-not (Test-Path -LiteralPath $binary)) {
              throw "Windows ARM64 native binary not found: $binary"
            }
          }
          if (-not (Get-ChildItem -Path "$app/@napi-rs/keyring-win32-arm64-msvc/*.node")) {
            throw "Windows ARM64 keyring binary not found"
          }
          $engine = "electron/release/win-arm64-unpacked/resources/app.asar.unpacked/dist/muxus-ssh-engine.win32-arm64-msvc.node"
          if (-not (Test-Path -LiteralPath $engine)) {
            throw "Windows ARM64 SSH engine not found: $engine"
          }

      - name: Verify universal native binaries
        if: runner.os == 'macOS'
        run: |
          app="electron/release/mac-universal/Muxus.app"
          if [ ! -d "$app" ]; then
            echo "Universal app bundle not found; release contents:" >&2
            ls electron/release >&2
            exit 1
          fi
          for arch in x64 arm64; do
            ls "$app/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs/keyring-darwin-$arch/"*.node
            ls "$app/Contents/Resources/app.asar.unpacked/dist/muxus-ssh-engine.darwin-$arch.node"
          done
