<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/muxus.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muxus</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      .muxus-tab-icon,
      .muxus-tab-number {
        transition: opacity 120ms;
      }
      .muxus-tab-number {
        position: absolute;
        inset: 0;
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 15px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
      }
      .muxus-tab-numbers-always .muxus-tab-number,
      .muxus-tab-number-alt .muxus-tab-numbers-shortcut .muxus-tab-number {
        opacity: 1;
      }
      .muxus-tab-numbers-always .muxus-tab-icon,
      .muxus-tab-number-alt .muxus-tab-numbers-shortcut .muxus-tab-icon {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
